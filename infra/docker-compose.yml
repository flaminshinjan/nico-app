services:
  # Optional service for high-fidelity DOCX conversion.
  # Start with: docker compose --profile docx up -d --build
  unoserver:
    profiles: ["docx"]
    build:
      context: ./unoserver
    image: nico/unoserver:local
    restart: unless-stopped
    ports:
      - "2003:2003"
    command: ["unoserver", "--interface", "0.0.0.0", "--port", "2003"]
